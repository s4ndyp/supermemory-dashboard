name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: dashboard-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🏷️ Image-tags bepalen
        id: tag
        run: |
          BASE="ghcr.io/${{ github.repository }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tags<<EOF"
              echo "$BASE:${GITHUB_REF_NAME}"
              echo "$BASE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=$BASE:latest" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Image bouwen en pushen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}
